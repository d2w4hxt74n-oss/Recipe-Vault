<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Recipe Vault</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f5;min-height:100vh}
  input,select,textarea,button{font-family:inherit}
  button{cursor:pointer}

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;
const CATEGORIES=["All","Protein","Vegetables","Carbs","Soup","Snacks","Desserts","Drinks","Others"];
const GROCERY_GROUPS=["Carbs","Protein","Vegetables","Others"];
const FONT="'Segoe UI',system-ui,sans-serif";
const INGREDIENT_MAP={
  Carbs:["rice","noodle","pasta","bread","flour","potato","oat","quinoa","tortilla","spaghetti","penne","ramen","udon","soba","bun","wrap","cracker","couscous","barley","corn","maize","taco","cereal","oatmeal"],
  Protein:["chicken","beef","pork","fish","salmon","tuna","shrimp","prawn","egg","tofu","tempeh","lamb","turkey","duck","crab","lobster","anchovy","sardine","lentil","chickpea","bean","soy","mince","steak","bacon","ham","sausage"],
  Vegetables:["onion","garlic","ginger","tomato","carrot","spinach","broccoli","capsicum","pepper","cucumber","lettuce","cabbage","mushroom","zucchini","eggplant","celery","leek","spring onion","scallion","bok choy","kale","asparagus","pea","chilli","chili","lemongrass","basil","cilantro","coriander","parsley","mint","thyme","rosemary","pumpkin","sweet potato","radish","beetroot","avocado"],
};
function classifyIngredient(name){
  const lower=name.toLowerCase();
  for(const[group,keywords]of Object.entries(INGREDIENT_MAP)){if(keywords.some(k=>lower.includes(k)))return group;}
  return "Others";
}
function getYTThumb(url){const m=(url||"").match(/(?:shorts\/|v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?"https://img.youtube.com/vi/"+m[1]+"/hqdefault.jpg":null;}
function getPlatform(url){if(!url)return"Link";if(url.includes("youtube")||url.includes("youtu.be"))return"YouTube";if(url.includes("facebook")||url.includes("fb.com"))return"Facebook";if(url.includes("instagram"))return"Instagram";if(url.includes("rednote")||url.includes("xiaohongshu"))return"RedNote";return"Link";}
const PC={YouTube:"#e24b4a",Facebook:"#378add",Instagram:"#d4537e",RedNote:"#e24b4a",Link:"#888780"};
const FS={width:"100%",boxSizing:"border-box",fontFamily:FONT,fontSize:14,padding:"9px 12px",border:"1px solid #d0d0d0",borderRadius:8,background:"#fff",color:"#1a1a1a",outline:"none"};
const LS={fontSize:12,fontWeight:500,color:"#555",display:"block",marginBottom:5,fontFamily:FONT,letterSpacing:"0.02em",textTransform:"uppercase"};

const PRESETS=[
  {id:1001,name:"Garlic Parmesan Chicken",category:"Protein",link:"https://www.facebook.com/reel/950483740597868",platform:"Facebook",thumbnail:null,calories:520,protein:42,servings:2,remarks:"",ingredients:[{name:"chicken breast",amount:"500g"},{name:"parmesan cheese",amount:"50g"},{name:"garlic",amount:"4 cloves"},{name:"butter",amount:"30g"},{name:"olive oil",amount:"15ml"},{name:"breadcrumbs",amount:"30g"},{name:"Italian seasoning",amount:"2 tsp"},{name:"salt & pepper",amount:"to taste"}]},
  {id:1002,name:"Steam Winter Melon Chicken",category:"Soup",link:"https://www.facebook.com/reel/1186147809889832",platform:"Facebook",thumbnail:null,calories:280,protein:32,servings:2,remarks:"",ingredients:[{name:"chicken thigh",amount:"400g"},{name:"winter melon",amount:"300g"},{name:"ginger",amount:"10g"},{name:"garlic",amount:"3 cloves"},{name:"soy sauce",amount:"15ml"},{name:"sesame oil",amount:"5ml"},{name:"oyster sauce",amount:"10ml"},{name:"cornstarch",amount:"10g"},{name:"spring onion",amount:"2 stalks"}]},
  {id:1003,name:"Steam Tofu, Tomato with Sliced Fish",category:"Protein",link:"https://www.facebook.com/reel/1165860918725273",platform:"Facebook",thumbnail:null,calories:240,protein:28,servings:2,remarks:"",ingredients:[{name:"silken tofu",amount:"300g"},{name:"tomato",amount:"2 medium"},{name:"sliced fish fillet",amount:"200g"},{name:"ginger",amount:"10g"},{name:"garlic",amount:"2 cloves"},{name:"soy sauce",amount:"15ml"},{name:"sesame oil",amount:"5ml"},{name:"spring onion",amount:"2 stalks"}]},
  {id:1004,name:"Unknown Facebook Recipe",category:"Others",link:"https://www.facebook.com/reel/1230989409132376",platform:"Facebook",thumbnail:null,calories:0,protein:0,servings:1,remarks:"",ingredients:[]},
  {id:1005,name:"Creamy Mushroom Chicken",category:"Protein",link:"https://www.fooddolls.com/creamy-mushroom-chicken-recipe/",platform:"Link",thumbnail:null,calories:520,protein:38,servings:4,remarks:"",ingredients:[{name:"chicken breast",amount:"700g"},{name:"all-purpose flour",amount:"40g"},{name:"olive oil",amount:"60ml"},{name:"garlic",amount:"3 cloves"},{name:"sun-dried tomatoes",amount:"60g"},{name:"kalamata olives",amount:"50g"},{name:"cremini mushrooms",amount:"200g"},{name:"heavy cream",amount:"120ml"},{name:"chicken stock",amount:"120ml"},{name:"parmesan cheese",amount:"100g"},{name:"fresh spinach",amount:"60g"}]},
  {id:1006,name:"Potato, Egg, Cucumber Crabmeat Salad",category:"Others",link:"https://www.facebook.com/reel/2596526697399646",platform:"Facebook",thumbnail:null,calories:320,protein:18,servings:2,remarks:"",ingredients:[{name:"potato",amount:"300g"},{name:"egg",amount:"2 large"},{name:"cucumber",amount:"150g"},{name:"crabmeat",amount:"100g"},{name:"mayonnaise",amount:"40g"},{name:"lemon juice",amount:"10ml"}]},
  {id:1007,name:"Sardines with Egg",category:"Protein",link:"https://www.facebook.com/share/r/1HUXmSH3qP/",platform:"Facebook",thumbnail:null,calories:350,protein:36,servings:2,remarks:"",ingredients:[{name:"canned sardines",amount:"200g"},{name:"egg",amount:"2 large"},{name:"garlic",amount:"3 cloves"},{name:"onion",amount:"100g"},{name:"tomato",amount:"120g"},{name:"olive oil",amount:"15ml"},{name:"spring onion",amount:"2 stalks"}]},
  {id:1008,name:"Prawn and Tomato Pasta",category:"Carbs",link:"https://www.facebook.com/reel/1491762315507340",platform:"Facebook",thumbnail:null,calories:520,protein:34,servings:2,remarks:"",ingredients:[{name:"pasta",amount:"180g"},{name:"prawn",amount:"250g"},{name:"tomato",amount:"360g"},{name:"garlic",amount:"4 cloves"},{name:"olive oil",amount:"30ml"},{name:"chili flakes",amount:"1 tsp"},{name:"parmesan cheese",amount:"30g"}]},
  {id:1009,name:"Tuscan Shrimp Pasta",category:"Carbs",link:"https://www.facebook.com/reel/654775467684679",platform:"Facebook",thumbnail:null,calories:620,protein:38,servings:2,remarks:"",ingredients:[{name:"pasta",amount:"180g"},{name:"shrimp",amount:"300g"},{name:"heavy cream",amount:"120ml"},{name:"sun-dried tomatoes",amount:"60g"},{name:"fresh spinach",amount:"60g"},{name:"garlic",amount:"4 cloves"},{name:"parmesan cheese",amount:"50g"},{name:"olive oil",amount:"20ml"}]},
];

function loadRecipes(){
  try{
    const s=localStorage.getItem("rv_recipes");
    if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length>0){const ids=new Set(a.map(r=>r.id));const toAdd=PRESETS.filter(p=>!ids.has(p.id));const merged=toAdd.length>0?[...a,...toAdd]:a;return merged;}}
  }catch(e){console.error("Load error",e);}
  return PRESETS;
}
function saveRecipes(recipes){
  try{
    const s=JSON.stringify(recipes);
    localStorage.setItem("rv_recipes",s);
    // verify write
    const check=localStorage.getItem("rv_recipes");
    if(check!==s) throw new Error("Write verification failed");
    return true;
  }catch(e){
    console.error("Save error",e);
    alert("Warning: Could not save to localStorage. Your browser may be in private/incognito mode which blocks saving.");
    return false;
  }
}

function ImagePicker({imagePreview,setImagePreview,setImageBase64,imageUrl,setImageUrl,link}){
  const [dragging,setDragging]=useState(false);
  const fileRef=useRef();
  function loadFile(file){if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=ev=>{setImagePreview(ev.target.result);setImageBase64(ev.target.result);setImageUrl("");};reader.readAsDataURL(file);}
  function handleDrop(e){e.preventDefault();setDragging(false);loadFile(e.dataTransfer.files[0]);}
  function handleUrlChange(e){setImageUrl(e.target.value);setImagePreview(e.target.value);setImageBase64(null);}
  function useYT(){const t=getYTThumb(link);if(t){setImagePreview(t);setImageBase64(null);setImageUrl("");}}
  return(
    <div style={{borderRadius:10,overflow:"hidden",border:"1px solid #d0d0d0"}}>
      {imagePreview?(
        <div style={{position:"relative"}}>
          <img src={imagePreview} alt="preview" onError={()=>setImagePreview(null)} style={{width:"100%",height:180,objectFit:"cover",display:"block"}}/>
          <button onClick={()=>{setImagePreview(null);setImageBase64(null);setImageUrl("");}} style={{position:"absolute",top:8,right:8,fontSize:12,padding:"4px 10px",background:"rgba(0,0,0,0.65)",color:"#fff",border:"none",borderRadius:6}}>Remove</button>
        </div>
      ):(
        <div style={{padding:14,display:"flex",flexDirection:"column",gap:10,background:"#fafafa"}}>
          <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={handleDrop} onClick={()=>fileRef.current.click()} style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,cursor:"pointer",padding:"18px 14px",border:`2px dashed ${dragging?"#378add":"#c0c0c0"}`,borderRadius:8,background:dragging?"#e6f1fb":"#fff"}}>
            <span style={{fontSize:28}}>🖼</span>
            <div style={{textAlign:"center"}}><div style={{fontSize:13,fontWeight:500}}>Drag & drop or click to upload</div><div style={{fontSize:11,color:"#888"}}>JPG, PNG, WEBP</div></div>
            <input ref={fileRef} type="file" accept="image/*" onChange={e=>loadFile(e.target.files[0])} style={{display:"none"}}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{flex:1,height:1,background:"#e0e0e0"}}/><span style={{fontSize:11,color:"#aaa"}}>or paste image URL</span><div style={{flex:1,height:1,background:"#e0e0e0"}}/></div>
          <input value={imageUrl} onChange={handleUrlChange} placeholder="https://example.com/image.jpg" style={{...FS,fontSize:13}}/>
          {link&&getYTThumb(link)&&(
            <div><div style={{fontSize:11,color:"#888",marginBottom:6}}>Auto-fetched YouTube thumbnail:</div>
              <div style={{position:"relative"}}><img src={getYTThumb(link)} alt="yt" style={{width:"100%",height:90,objectFit:"cover",borderRadius:7,display:"block",cursor:"pointer"}} onClick={useYT}/>
                <div onClick={useYT} style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.38)",borderRadius:7,cursor:"pointer",fontSize:13,color:"#fff",fontWeight:600}}>Use this</div>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function RecipeModal({onClose,onSave,initial}){
  const editing=!!initial;
  const [step,setStep]=useState("form");
  const [link,setLink]=useState(initial?.link||"");
  const [name,setName]=useState(initial?.name||"");
  const [category,setCategory]=useState(initial?.category||"Protein");
  const [ingredientText,setIngredientText]=useState(initial?(initial.ingredients||[]).map(i=>i.amount?i.name+" · "+i.amount:i.name).join("\n"):"");
  const [remarks,setRemarks]=useState(initial?.remarks||"");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const [imagePreview,setImagePreview]=useState(initial?.thumbnail||null);
  const [imageBase64,setImageBase64]=useState(null);
  const [imageUrl,setImageUrl]=useState("");
  function getFinal(){return imageBase64||imagePreview||getYTThumb(link);}
  function handleSave(){
    const base=result||{name,category,link,ingredients:ingredientText.split("\n").map(l=>({name:l.trim(),amount:""})).filter(i=>i.name),calories:initial?.calories||0,servings:initial?.servings||1};
    onSave({id:initial?.id||Date.now(),...base,name:result?.name||name,category:result?.category||category,link,thumbnail:getFinal(),platform:getPlatform(link),protein:result?.protein??initial?.protein??null,remarks});
    onClose();
  }
  const iF=e=>e.target.style.borderColor="#378add";
  const iB=e=>e.target.style.borderColor="#d0d0d0";
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
      <div style={{background:"#fff",borderRadius:14,border:"1px solid #e0e0e0",padding:"1.75rem",width:"min(540px,92vw)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.5rem"}}>
          <h2 style={{margin:0,fontSize:20,fontWeight:600,color:"#1a1a1a"}}>{editing?"Edit recipe":"Add recipe"}</h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,color:"#888"}}>×</button>
        </div>
        {step==="form"&&(
          <div style={{display:"flex",flexDirection:"column",gap:18}}>
            <div>
              <label style={LS}>Video / Recipe link</label>
              <input value={link} onChange={e=>setLink(e.target.value)} onFocus={iF} onBlur={iB} placeholder="https://youtube.com/shorts/... or facebook.com/..." style={FS}/>
            </div>
            <div><label style={LS}>Cover image</label><ImagePicker imagePreview={imagePreview} setImagePreview={setImagePreview} setImageBase64={setImageBase64} imageUrl={imageUrl} setImageUrl={setImageUrl} link={link}/></div>
            <div><label style={LS}>Recipe name</label><input value={name} onChange={e=>setName(e.target.value)} onFocus={iF} onBlur={iB} placeholder="e.g. Creamy mushroom pasta" style={FS}/></div>
            <div><label style={LS}>Category</label><select value={category} onChange={e=>setCategory(e.target.value)} onFocus={iF} onBlur={iB} style={FS}>{CATEGORIES.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}</select></div>
            <div><label style={LS}>Ingredients <span style={{fontWeight:400,textTransform:"none",fontSize:11,color:"#999"}}>(one per line, e.g. chicken · 300g)</span></label><textarea value={ingredientText} onChange={e=>setIngredientText(e.target.value)} onFocus={iF} onBlur={iB} placeholder={"chicken breast · 300g\ngarlic · 3 cloves\nsoy sauce · 15ml"} rows={5} style={{...FS,resize:"vertical",lineHeight:1.6}}/></div>
            <div><label style={LS}>Remarks <span style={{fontWeight:400,textTransform:"none",fontSize:11,color:"#999"}}>(optional)</span></label><textarea value={remarks} onChange={e=>setRemarks(e.target.value)} onFocus={iF} onBlur={iB} placeholder="e.g. Add less salt, great for meal prep..." rows={3} style={{...FS,resize:"vertical",lineHeight:1.6}}/></div>
            {error&&<p style={{color:"#c0392b",fontSize:13,margin:0}}>{error}</p>}
            <div style={{display:"flex",gap:10}}>
              {editing&&<button onClick={handleSave} style={{flex:1,padding:10,fontSize:14,fontWeight:500,background:"#fff",color:"#1a1a1a",border:"1px solid #d0d0d0",borderRadius:8}}>Save changes</button>}
              <button onClick={handleSave} style={{flex:1,padding:10,fontSize:14,fontWeight:500,background:"#1a1a1a",color:"#fff",border:"none",borderRadius:8}}>{editing?"Save changes":"Save to vault"}</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function GroceryModal({recipes,onClose}){
  const [selected,setSelected]=useState([]);
  const [overrides,setOverrides]=useState(()=>{try{const s=localStorage.getItem("grocery_overrides");return s?JSON.parse(s):{};}catch{return{};}});
  const [movingItem,setMovingItem]=useState(null);
  function applyOverride(key,group){const u={...overrides,[key]:group};setOverrides(u);setMovingItem(null);try{localStorage.setItem("grocery_overrides",JSON.stringify(u));}catch{}}
  const toggle=id=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const allIngs=recipes.filter(r=>selected.includes(r.id)).flatMap((r,ri)=>(r.ingredients||[]).map((ing,ii)=>({...ing,_key:ri+"-"+ii})));
  const grouped={};GROCERY_GROUPS.forEach(g=>grouped[g]=[]);
  allIngs.forEach(ing=>{const g=overrides[ing._key]||classifyIngredient(ing.name);grouped[g].push(ing);});
  const GM={Carbs:{icon:"🌾",color:"#7a4f0d"},Protein:{icon:"🥩",color:"#7a1f1f"},Vegetables:{icon:"🥦",color:"#2a5c1a"},Others:{icon:"🧂",color:"#444"}};
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
      <div style={{background:"#fff",borderRadius:14,border:"1px solid #e0e0e0",padding:"1.75rem",width:"min(560px,92vw)",maxHeight:"88vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.25rem"}}>
          <h2 style={{margin:0,fontSize:20,fontWeight:600,color:"#1a1a1a"}}>Grocery planner</h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,color:"#888"}}>×</button>
        </div>
        <div style={{marginBottom:"1.25rem",padding:"14px 16px",background:"#f7f7f7",borderRadius:10}}>
          <div style={{fontSize:12,fontWeight:500,color:"#555",textTransform:"uppercase",letterSpacing:"0.03em",marginBottom:10}}>Select recipes to include</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {recipes.map(r=>{const on=selected.includes(r.id);return(<button key={r.id} onClick={()=>toggle(r.id)} style={{fontSize:13,padding:"6px 14px",background:on?"#1a1a1a":"#fff",color:on?"#fff":"#444",border:`1px solid ${on?"#1a1a1a":"#d0d0d0"}`,borderRadius:20,fontWeight:on?500:400}}>{r.name}</button>);})}
          </div>
        </div>
        {selected.length===0?(
          <div style={{textAlign:"center",padding:"2rem 1rem",color:"#aaa",fontSize:14}}>Select one or more recipes above to see your grocery list</div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            {GROCERY_GROUPS.map(group=>grouped[group].length>0&&(
              <div key={group} style={{padding:"14px 16px",background:"#fafafa",borderRadius:10,border:"1px solid #ebebeb"}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
                  <span style={{fontSize:16}}>{GM[group].icon}</span>
                  <span style={{fontSize:14,fontWeight:600,color:GM[group].color}}>{group}</span>
                  <span style={{fontSize:11,color:"#aaa"}}>({grouped[group].length} item{grouped[group].length!==1?"s":""})</span>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {grouped[group].map((ing,i)=>(
                    <div key={i} style={{display:"inline-block"}}>
                      {movingItem===ing._key?(
                        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                          {GROCERY_GROUPS.filter(g=>g!==group).map(g=><button key={g} onClick={()=>applyOverride(ing._key,g)} style={{fontSize:11,padding:"3px 10px",background:"#1a1a1a",color:"#fff",border:"none",borderRadius:6}}>{"→ "+g}</button>)}
                          <button onClick={()=>setMovingItem(null)} style={{fontSize:11,padding:"3px 8px",background:"#f2f2f2",color:"#666",border:"1px solid #ddd",borderRadius:6}}>Cancel</button>
                        </div>
                      ):(
                        <span onClick={()=>setMovingItem(ing._key)} style={{fontSize:13,background:"#fff",border:"1px solid #e5e5e5",borderRadius:6,padding:"5px 12px",color:"#333",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:5}}>
                          {ing.name}{ing.amount?" · "+ing.amount:""}<span style={{fontSize:10,color:"#bbb"}}>✎</span>
                        </span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [recipes,setRecipes]=useState(loadRecipes);
  const [activeCategory,setActiveCategory]=useState("All");
  const [showAdd,setShowAdd]=useState(false);
  const [editingRecipe,setEditingRecipe]=useState(null);
  const [showGrocery,setShowGrocery]=useState(false);
  const [expandedId,setExpandedId]=useState(null);
  const [saveStatus,setSaveStatus]=useState("idle");

  function persist(u){saveRecipes(u);}
  function handleManualSave(){setSaveStatus("saving");const ok=persist(recipes);setSaveStatus(ok===false?"error":"saved");setTimeout(()=>setSaveStatus("idle"),2500);}
  function saveRecipe(r){setRecipes(prev=>{const u=[r,...prev];persist(u);return u;});}
  function updateRecipe(r){setRecipes(prev=>{const u=prev.map(x=>x.id===r.id?r:x);persist(u);return u;});setEditingRecipe(null);}
  function deleteRecipe(id){if(!window.confirm("Delete this recipe?"))return;setRecipes(prev=>{const u=prev.filter(r=>r.id!==id);persist(u);return u;});}
  const filtered=activeCategory==="All"?recipes:recipes.filter(r=>r.category===activeCategory);

  return(
    <div style={{padding:"1.5rem 1rem",maxWidth:740,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1.5rem",flexWrap:"wrap",gap:10}}>
        <div>
          <h1 style={{margin:0,fontSize:24,fontWeight:600,color:"#1a1a1a"}}>🍳 Recipe Vault</h1>
          <p style={{margin:"2px 0 0",fontSize:13,color:"#888"}}>{recipes.length} recipe{recipes.length!==1?"s":""} saved</p>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={handleManualSave} style={{fontSize:13,padding:"8px 16px",background:saveStatus==="saved"?"#2a5c1a":saveStatus==="error"?"#c0392b":"#fff",border:`1px solid ${saveStatus==="saved"?"#2a5c1a":saveStatus==="error"?"#c0392b":"#d0d0d0"}`,borderRadius:8,color:saveStatus==="saved"||saveStatus==="error"?"#fff":"#333",fontWeight:500}}>
            {saveStatus==="saving"?"Saving...":saveStatus==="saved"?"✓ Saved!":saveStatus==="error"?"✗ Save failed":"💾 Save vault"}
          </button>
          {recipes.length>0&&<button onClick={()=>setShowGrocery(true)} style={{fontSize:13,padding:"8px 16px",background:"#fff",border:"1px solid #d0d0d0",borderRadius:8,color:"#333",fontWeight:500}}>🛒 Grocery list</button>}
          <button onClick={()=>setShowAdd(true)} style={{fontSize:13,padding:"8px 16px",background:"#1a1a1a",color:"#fff",border:"none",borderRadius:8,fontWeight:500}}>+ Add recipe</button>
        </div>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:"1.25rem"}}>
        {CATEGORIES.map(c=>{const on=activeCategory===c;return(<button key={c} onClick={()=>setActiveCategory(c)} style={{fontSize:13,padding:"5px 14px",background:on?"#1a1a1a":"#f2f2f2",color:on?"#fff":"#555",border:`1px solid ${on?"#1a1a1a":"#e0e0e0"}`,borderRadius:20,fontWeight:on?500:400}}>{c}</button>);})}
      </div>
      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"4rem 1rem"}}>
          <div style={{fontSize:44,marginBottom:12}}>🍳</div>
          <p style={{fontSize:15,color:"#aaa"}}>No recipes yet. Add your first one!</p>
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:14}}>
          {filtered.map(r=>(
            <div key={r.id} style={{background:"#fff",border:"1px solid #e8e8e8",borderRadius:12,overflow:"hidden"}}>
              <div style={{position:"relative"}}>
                {r.thumbnail?<img src={r.thumbnail} alt={r.name} onError={e=>{e.target.style.display="none";}} style={{width:"100%",height:140,objectFit:"cover",display:"block"}}/>:<div style={{width:"100%",height:140,background:"#f5f5f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:36}}>🍽</div>}
                <span style={{position:"absolute",top:8,left:8,fontSize:11,padding:"2px 8px",borderRadius:6,background:PC[r.platform]||"#888",color:"#fff",fontWeight:600}}>{r.platform}</span>
                <span style={{position:"absolute",top:8,right:8,fontSize:11,padding:"2px 8px",borderRadius:6,background:"rgba(0,0,0,0.55)",color:"#fff"}}>{r.category}</span>
              </div>
              <div style={{padding:"10px 12px 12px"}}>
                <div style={{fontWeight:600,fontSize:14,marginBottom:3,lineHeight:1.35,color:"#1a1a1a"}}>{r.name}</div>
                <div style={{fontSize:12,color:"#999",marginBottom:8}}>{r.calories>0?r.calories+" kcal":""}{r.protein?(" · "+r.protein+"g protein"):""}{r.servings>0?(" · "+r.servings+" serving"+(r.servings!==1?"s":"")):""}</div>
                {r.remarks&&<div style={{fontSize:12,color:"#777",marginBottom:8,padding:"6px 8px",background:"#fafafa",borderRadius:6,border:"1px solid #f0f0f0",lineHeight:1.5,fontStyle:"italic"}}>{r.remarks}</div>}
                <button onClick={()=>setExpandedId(expandedId===r.id?null:r.id)} style={{fontSize:12,padding:"5px 10px",width:"100%",marginBottom:6,background:"#f7f7f7",border:"1px solid #e8e8e8",borderRadius:7,color:"#444"}}>
                  {expandedId===r.id?"Hide ingredients":"Show ingredients"}
                </button>
                {expandedId===r.id&&(
                  <div style={{marginBottom:8,display:"flex",flexWrap:"wrap",gap:4}}>
                    {(r.ingredients||[]).map((ing,i)=><span key={i} style={{fontSize:11,background:"#f5f5f5",borderRadius:5,padding:"2px 8px",border:"1px solid #ebebeb",color:"#555"}}>{ing.name}{ing.amount?" · "+ing.amount:""}</span>)}
                  </div>
                )}
                <div style={{display:"flex",gap:6}}>
                  {r.link&&<a href={r.link} target="_blank" rel="noreferrer" style={{flex:1,fontSize:12,padding:"5px 0",textAlign:"center",border:"1px solid #e0e0e0",borderRadius:7,textDecoration:"none",color:"#378add",background:"#f7f7f7",display:"block"}}>Watch</a>}
                  <button onClick={()=>setEditingRecipe(r)} style={{flex:1,fontSize:12,padding:"5px 0",background:"#f7f7f7",border:"1px solid #e0e0e0",borderRadius:7,color:"#444"}}>Edit</button>
                  <button onClick={()=>deleteRecipe(r.id)} style={{fontSize:12,padding:"5px 8px",color:"#c0392b",border:"1px solid #f5c6c6",background:"#fdf2f2",borderRadius:7}}>Delete</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
      {showAdd&&<RecipeModal onClose={()=>setShowAdd(false)} onSave={saveRecipe}/>}
      {editingRecipe&&<RecipeModal onClose={()=>setEditingRecipe(null)} onSave={updateRecipe} initial={editingRecipe}/>}
      {showGrocery&&<GroceryModal recipes={recipes} onClose={()=>setShowGrocery(false)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
